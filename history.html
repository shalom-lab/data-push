<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GitHub Data Push</title>
  <link rel="icon" href="icons/icon48.png?v=2" type="image/png" />
  <style>#app-header .nav-inner{display:flex;align-items:center;gap:16px;flex-wrap:nowrap;max-width:1120px;margin:0 auto;padding:10px 16px}#app-header .nav-links{display:flex;flex:1;gap:4px;flex-wrap:nowrap;min-width:0;overflow:auto}#app-header .nav-right,#app-header .icon-group{display:flex;align-items:center;gap:8px;flex-shrink:0}#app-header .user-link{display:inline-flex;align-items:center;gap:8px;height:32px;color:inherit;text-decoration:none}#app-header .user-link img{width:22px;height:22px;border-radius:50%;object-fit:cover}#app-header .icon-btn{box-sizing:border-box;width:32px;height:32px;padding:0;border:0;border-radius:8px;background:transparent;display:inline-flex;align-items:center;justify-content:center}</style>
  <link rel="stylesheet" href="css/app.css?v=5" />
</head>
<body data-page="history" data-title-key="historyPage.title">
  <header id="app-header"></header>
  <main class="page">
    <div class="page-head">
      <h1 data-i18n="historyPage.title"></h1>
      <p data-i18n="historyPage.subtitle"></p>
    </div>
    <div class="toolbar">
      <button type="button" class="btn btn-sm btn-danger" id="clearHistory" data-i18n="historyPage.clear"></button>
    </div>
    <div id="historyList"></div>
  </main>
  <footer id="app-footer"></footer>
  <script src="js/i18n.js?v=5"></script>
  <script src="js/storage.js?v=5"></script>
  <script src="js/ui.js?v=5"></script>
  <script src="js/github.js?v=5"></script>
  <script src="js/templates.js?v=5"></script>
  <script src="js/form.js?v=5"></script>
  <script src="js/shell.js?v=5"></script>
  <script src="js/page-history.js?v=5"></script>
</body>
</html>
